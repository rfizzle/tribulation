plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'jacoco'
}

// Version, base repositories, gametest/datagen wiring, JaCoCo + jacocoMergedReport, datagen
// idempotence, and packaging excludes: hub-owned, synced verbatim (see mc-gradle-builds).
apply from: 'gradle/concord-common.gradle'

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    // The shared Shedaniel repo is scoped to Cloth Config only; REI and its Architectury
    // dependency resolve from here.
    maven {
        name = 'ShedanielRei'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    // GitHub Releases — resolves sibling Concord mods straight from their release jars while
    // their Modrinth projects are not publicly resolvable. Artifact-only (no metadata), scoped
    // to the rfizzle org so it never shadows a real Maven group.
    ivy {
        name = 'GitHubReleases'
        url = 'https://github.com'
        patternLayout {
            artifact '/[organisation]/[module]/releases/download/v[revision]/[module]-[revision].jar'
        }
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'rfizzle'
        }
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client source set
    "clientImplementation"("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // ModMenu 11.x — Config screen entry point for Fabric 1.21.1. Compile-only + dev runtime
    // so end users get the integration only when they install ModMenu themselves.
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    // Cloth Config 15.x — Config screen builder used by ModMenuIntegration. Compile-only for
    // the api surface; full mod in dev runtime.
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Jade 15.x — Probe-tooltip integration. No api split published; compile-only links the
    // full mod but only the snownee.jade.api surface is referenced.
    modCompileOnly "maven.modrinth:jade:${project.jade_version}"
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}"

    // WTHIT 12.x — Alternative probe-tooltip integration (Jade fallback). Compile-only against
    // the API split. Discovered via waila_plugins.json at runtime.
    modCompileOnly "mcp.mobius.waila:wthit-api:${project.wthit_version}"

    // EMI 1.x — Recipe viewer info panel for the Shatter Shard.
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    // REI 16.x — Recipe viewer info panel (MC 1.21, runs on 1.21.1).
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modLocalRuntime "dev.architectury:architectury-fabric:${project.architectury_version}"

    // JEI 19.x — Recipe viewer info panel. The `fabric` runtime jar shades in all
    // `common-api` classes, so `transitive = false` prevents Loom remap from seeing the
    // same classes twice and emitting `duplicate input class` warnings.
    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
    modLocalRuntime("mezz.jei:jei-1.21.1-fabric:${project.jei_version}") {
        transitive = false
    }

    // Meridian — sibling Concord mod. Compile-only against its stable `api` package and the
    // `meridian:mob_equipment` enchantment tag; the whole integration lives behind an
    // isModLoaded("meridian") guard and falls back to vanilla enchants when absent. No
    // modLocalRuntime: keeping Meridian out of the dev/gametest runtime means every existing
    // gametest keeps isModLoaded("meridian") == false and exercises the fallback path.
    modCompileOnly "rfizzle:meridian:${project.meridian_version}"

    // Tests
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Knot-based classloader that boots Fabric before tests run — registries,
    // item registrations, and onInitialize are available without Bootstrap.bootStrap().
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// Expose the client source set's compiled output (not its dependency configurations) to unit
// tests so they can reach client-only classes and the client resource root. Only .output is
// added, never client.compileClasspath/runtimeClasspath, so the unmapped fabric-api sibling the
// shared testRuntimeClasspath exclusion guards against is never pulled in.
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

test {
    // SpriteMarginTest reads the glyph specs off disk to learn which shipped textures are
    // sprites and owe a transparent margin. art/ is not on the test classpath, so declare it
    // as an input too — otherwise a spec edit leaves the task UP-TO-DATE and the check skips.
    // Only the specs: the renders glyph.py drops beside them are gitignored throwaways, and
    // snapshotting those would let a routine re-render invalidate the whole test task. The
    // masters the test also opens need no declaration — they are on the test runtime classpath.
    inputs.files(fileTree(dir: 'art/glyphs', include: '**/*.glyph')).withPropertyName('glyphSpecs')
}
